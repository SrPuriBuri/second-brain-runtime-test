name: AI Stock Trader Historical Research
on:
  workflow_dispatch:
    inputs:
      command:
        description: Manual historical audit or preregistered simulation; no trading
        type: choice
        default: data-audit
        options: [data-audit, run-all]
permissions:
  contents: read
concurrency:
  group: ai-stock-trader-paper
  cancel-in-progress: false
jobs:
  research:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r trading-runtime-requirements.txt
      - name: Read historical data and persist private research evidence
        env:
          RESEARCH_COMMAND: ${{ inputs.command }}
          ALPACA_PAPER_API_KEY: ${{ secrets.Alpaca_API_KEY || secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.Alpaca_Secret_KEY || secrets.ALPACA_PAPER_SECRET_KEY }}
          SECOND_BRAIN_PAT: ${{ secrets.SECOND_BRAIN_PAT || secrets.SECOND_BRAIN_PRIVATE_REPO_TOKEN }}
        run: python scripts/trading_research_safe_run.py "$RESEARCH_COMMAND"
