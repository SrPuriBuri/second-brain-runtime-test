name: AI Stock Trader Paper Research

on:
  workflow_dispatch:
    inputs:
      command:
        description: Read-only Paper validation or research
        type: choice
        default: dry-run
        options: [dry-run, validate-paper, connectivity, inventory, research, reconcile, slot-status, scheduled, report]
  schedule:
    # Includes 08:10 Madrid in both seasons; session logic decides actual work.
    - cron: '*/15 5-22 * * 1-5'

permissions:
  contents: read

concurrency:
  group: ai-stock-trader-paper
  cancel-in-progress: false

jobs:
  research:
    # Phase 2 is manual. Publishing this workflow must not start recurring research.
    if: github.event_name == 'workflow_dispatch' || vars.AI_STOCK_TRADER_RESEARCH_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trading-runtime-requirements.txt
      - name: Install isolated trading dependencies
        run: python -m pip install -r trading-runtime-requirements.txt
      - name: Run research-only runtime
        env:
          TRADING_COMMAND: ${{ inputs.command || 'scheduled' }}
          ALPACA_PAPER_API_KEY: ${{ secrets.Alpaca_API_KEY || secrets.ALPACA_PAPER_API_KEY }}
          ALPACA_PAPER_SECRET_KEY: ${{ secrets.Alpaca_Secret_KEY || secrets.ALPACA_PAPER_SECRET_KEY }}
          SECOND_BRAIN_PAT: ${{ secrets.SECOND_BRAIN_PAT || secrets.SECOND_BRAIN_PRIVATE_REPO_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SECOND_BRAIN_TRADING_AI_PROVIDER: no_ai
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/trading_safe_run.py "$TRADING_COMMAND"
